[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpymusic"
version = "0.1.0"
description = "MusicXML 曲谱转换与 SVG 同步播放工具"
requires-python = ">=3.11"
dependencies = [
    "verovio>=6.3.0",
    "music21>=10.5.0",
    "mido>=1.3.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.9"]
audio = ["pyfluidsynth>=1.4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
zpymusic = "zpymusic.cli:main"
zpygui = "zpymusic.gui:run_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    # tests/conftest.py 故意用工作区内的实现覆盖内置 tmp_path（受限沙箱无法写系统 TEMP），
    # 覆盖内置 fixture 会触发 DeprecationWarning，这里显式静音。
    "ignore::DeprecationWarning",
]
